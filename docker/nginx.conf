server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  # Vite content-hashes these files. They can be cached for a long time.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # The game uses hash routes (#/roster), so the server only needs real files.
  # Unknown paths still return the app instead of a bare 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
